<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // The base path is substituted at build time (see package.json's
    // "postbuild" script) from the same VITE_BASE_PATH used for the Vite
    // build, so this never has to guess a repo name from the URL — which
    // breaks for custom domains and user/organization GitHub Pages sites
    // that are served from the root.
    var base = "__BASE_PATH__";
    sessionStorage.redirect = location.href;
    location.replace(base);
  </script>
</head>
<body></body>
</html>
